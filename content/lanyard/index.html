<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蒋维嘉 · 可以拖动的工作证</title>
    <script type="module" crossorigin src="./assets/index-stable-hanging.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C0j9TUbH.css">
    <style>
      .tf-nav, .brand, .hint { display: none; }
      .page { min-height: 100%; height: 100%; }
      .canvas-stage { height: 100dvh; flex: none; }
      canvas { touch-action: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && window.parent !== window) {
          event.preventDefault();
          window.parent.postMessage({ type: 'portfolio-close' }, location.origin);
        }
      });
    </script>
  </body>
</html>
